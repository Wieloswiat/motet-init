[package]
name = "motet-lexgen"
description = "Generates Rust and TypeScript types from Motet's lexicons, and checks generated code is current."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "motet-lexgen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile = "3"

[lints]
workspace = true
