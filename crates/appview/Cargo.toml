[package]
name = "motet-appview"
description = "Motet's AppView: sign-in, the XRPC API, the indexer and its archive, projections, search and live updates."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "motet-appview"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
atproto-client.workspace = true
atproto-dasl.workspace = true
atproto-identity = { workspace = true, features = ["hickory-dns"] }
atproto-oauth.workspace = true
atproto-record.workspace = true
atproto-space.workspace = true
atproto-space-client.workspace = true
atproto-tap.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
motet-log.workspace = true
motet-net.workspace = true
motet-rules.workspace = true
motet-spaces.workspace = true
motet-xrpc.workspace = true
object_store.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
motet-lexicons.workspace = true
# Real tenor shards and routers exercise public Space reads in-process.
motet-tenor.workspace = true
motet-testkit = { workspace = true, features = ["services"] }
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["time"] }
tower.workspace = true

[lints]
workspace = true
