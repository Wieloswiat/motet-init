[package]
name = "motet-tenor"
description = "Motet's group host: hosts each World as a group account, admits posts, issues dice, runs the World's Spaces."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "motet-tenor"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
atproto-dasl.workspace = true
atproto-identity = { workspace = true, features = ["hickory-dns"] }
atproto-lexicon.workspace = true
atproto-oauth.workspace = true
atproto-record.workspace = true
atproto-repo.workspace = true
atproto-space.workspace = true
atproto-xrpcs.workspace = true
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
chacha20poly1305.workspace = true
futures.workspace = true
getrandom.workspace = true
motet-dice.workspace = true
motet-lexicons.workspace = true
motet-log.workspace = true
motet-net.workspace = true
motet-rules.workspace = true
motet-xrpc.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
slatedb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
atproto-firehose = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e", default-features = false }
atproto-testkit.workspace = true
motet-testkit = { workspace = true, features = ["services"] }
futures.workspace = true
p256 = "0.14"
proptest.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
