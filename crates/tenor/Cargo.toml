[package]
name = "motet-tenor"
description = "Motet's group host: hosts each World as a group account, admits posts, issues dice, runs the World's Spaces."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "motet-tenor"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
atproto-identity.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
getrandom.workspace = true
motet-dice.workspace = true
motet-lexicons.workspace = true
motet-log.workspace = true
motet-net.workspace = true
motet-rules.workspace = true
motet-xrpc.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
motet-testkit = { workspace = true, features = ["services"] }
futures.workspace = true
proptest.workspace = true

[lints]
workspace = true
