# Slower assurance that shouldn't hold up a pull request: dependency
# advisories (new ones appear without any change of ours) and mutation
# testing (which code could change without any test noticing).
name: Scheduled

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install native devenv
        # devenv 2.4.0, aligned with the module revision in devenv.lock.
        run: nix profile add github:cachix/devenv/9655d320b8f9df74dbecf681f52a7334574606c3
      # cargo-deny's advisories, then `pnpm audit --prod` (the `audit` script).
      - run: devenv shell -- audit

  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # The crates whose logic the rest relies on. Add a crate here once its
        # tests are meant to pin its behaviour down.
        crate: [motet-dice, motet-rules, motet-log, motet-xrpc, motet-spaces]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install native devenv
        # devenv 2.4.0, aligned with the module revision in devenv.lock.
        run: nix profile add github:cachix/devenv/9655d320b8f9df74dbecf681f52a7334574606c3
      - env:
          CRATE: ${{ matrix.crate }}
        run: devenv shell -- mutants --package "$CRATE" --no-shuffle
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants.out/

  mutants-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install native devenv
        # devenv 2.4.0, aligned with the module revision in devenv.lock.
        run: nix profile add github:cachix/devenv/9655d320b8f9df74dbecf681f52a7334574606c3
      - run: devenv shell -- mutants-web
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-web
          path: |
            packages/design/reports/mutation/
            apps/web/reports/mutation/
