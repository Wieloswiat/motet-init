# Container images from main, for deploy/compose.yaml and whatever runs Motet
# next. Built by nix (no Dockerfile), tagged with the commit.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        image: [appview, tenor]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Build and push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/motet-${{ matrix.image }}
        run: |
          image="${IMAGE,,}"
          nix build ".#${{ matrix.image }}-image" -o result
          nix shell nixpkgs#skopeo --command sh -c "
            ./result | skopeo copy --dest-creds \"\$REGISTRY_USER:\$REGISTRY_TOKEN\" \
              docker-archive:/dev/stdin docker://$image:${GITHUB_SHA}
            skopeo copy --dest-creds \"\$REGISTRY_USER:\$REGISTRY_TOKEN\" \
              docker://$image:${GITHUB_SHA} docker://$image:main
          "
