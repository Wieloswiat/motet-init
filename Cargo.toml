[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Wieloswiat/motet-init"

[workspace.dependencies]
# Motet crates. Paths only: nothing here is published.
motet-dice = { path = "crates/dice" }
motet-lexicons = { path = "crates/lexicons" }
motet-log = { path = "crates/log" }
motet-net = { path = "crates/net" }
motet-render = { path = "crates/render" }
motet-rules = { path = "crates/rules" }
motet-spaces = { path = "crates/spaces" }
motet-tenor = { path = "crates/tenor" }
motet-appview = { path = "crates/appview" }
motet-testkit = { path = "crates/testkit" }
motet-xrpc = { path = "crates/xrpc" }

# atproto-crates. The released crates come from crates.io as one version;
# bump them together. The Spaces and Tap crates (atproto-space,
# atproto-space-client, atproto-tap-client) and atproto-testkit aren't
# released yet: they are added from git, at one pinned revision of
# https://tangled.org/ngerakines.me/atproto-crates, by the change that first
# uses them, and the released crates move to that same revision then so no
# two copies of the core types meet (docs/adr/0004-atproto-crates.md).
atproto-attestation = "0.14.5"
atproto-client = "0.14.5"
atproto-identity = { version = "0.14.5", default-features = false }
atproto-lexicon = { version = "0.14.5", default-features = false }
atproto-oauth = "0.14.5"
atproto-record = "0.14.5"

# Runtime and services.
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
object_store = { version = "0.14", features = ["aws"] }
rand = "0.10"
# 0.12, the version atproto-crates uses, so their clients can be handed
# motet-net's hardened client instead of building their own.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "derive", "macros", "migrate", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

# Typst. The worker's Typst follows typst.ts once the vector renderer lands
# (docs/adr/0008-rendering.md); until then plain typst for static SVG.
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
rlimit = "0.11"

# Testing.
insta = { version = "1", features = ["json"] }
proptest = "1"
proptest-state-machine = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# A bare unwrap hides why a value must exist; `expect("why")` says it.
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Debug info for our crates only; dependencies compile faster without it.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package.proptest]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
