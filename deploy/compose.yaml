# The deployment-shaped stack: every part Motet runs, wired the way production
# will be, on one machine. `stack` in the dev shell builds the images with nix
# and brings this up with podman-compose; `docker compose` works the same.
#
# Development credentials only. `devenv up` also runs these services natively.
# The atproto services, AppView, tenor and Caddy share PLC's network namespace.
# Do not run this stack beside `devenv up`: both use the same HTTPS origin.

name: motet

x-local-network-env: &local-network-env
  SSL_CERT_FILE: /run/motet-tls/ca-bundle.crt
  NO_PROXY: localhost,127.0.0.1,::1,postgres,s3,host.docker.internal,motet.test,.motet.test
  no_proxy: localhost,127.0.0.1,::1,postgres,s3,host.docker.internal,motet.test,.motet.test

x-local-ca: &local-ca '../.devenv/state/tls/ca-bundle.crt:/run/motet-tls/ca-bundle.crt:ro'

x-local-resolver: &local-resolver
  - source: local-resolver
    target: /etc/resolv.conf

services:
  postgres:
    # PostgreSQL with pg_search (ParadeDB). Pin a tag that matches the
    # PostgreSQL major in nix/devenv.nix.
    image: docker.io/paradedb/paradedb:latest-pg18
    environment:
      POSTGRES_USER: motet
      POSTGRES_PASSWORD: motet
      POSTGRES_DB: motet
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'motet']
      interval: 2s
      retries: 30

  s3:
    # SeaweedFS's S3 gateway, as in the dev shell (it has the conditional
    # writes the log's fencing needs).
    image: docker.io/chrislusf/seaweedfs:latest
    command: server -dir=/data -master.telemetry=false -volume.max=32 -s3 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    volumes:
      - s3:/data
    ports:
      - 127.0.0.1:8333:8333

  buckets:
    image: docker.io/chrislusf/seaweedfs:latest
    depends_on: [s3]
    restart: on-failure
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        until echo 's3.bucket.list' | weed shell -master=s3:9333 >/dev/null 2>&1; do
          sleep 1
        done
        for bucket in motet-archive motet-tenor; do
          if ! output=$$(echo "s3.bucket.create -name $$bucket" | weed shell -master=s3:9333 2>&1); then
            echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -Eq "^[[:space:]]+$$bucket[[:space:]]" \
              || { echo "$$output" >&2; exit 1; }
          fi
        done

  tenor-key:
    image: docker.io/chrislusf/seaweedfs:latest
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        umask 077
        if [ ! -f /key/master-key ]; then
          dd if=/dev/urandom of=/key/master-key.tmp bs=32 count=1
          mv /key/master-key.tmp /key/master-key
        fi
        chown 65534:65534 /key/master-key
        chmod 600 /key/master-key
    volumes:
      - tenor-key:/key

  appview-oauth-key:
    image: docker.io/chrislusf/seaweedfs:latest
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - |
        set -eu
        umask 077
        for key in oauth-signing-key session-key; do
          if [ ! -f "/key/$$key" ]; then
            dd if=/dev/urandom of="/key/$$key.tmp" bs=32 count=1
            mv "/key/$$key.tmp" "/key/$$key"
          fi
          chown 65534:65534 "/key/$$key"
          chmod 600 "/key/$$key"
        done
    volumes:
      - appview-oauth-key:/key

  plc:
    image: localhost/motet-plc:dev
    environment:
      <<: *local-network-env
      NODE_EXTRA_CA_CERTS: /run/motet-tls/rootCA.crt
      PORT: '2582'
    configs: *local-resolver
    volumes:
      - *local-ca
      - ../.devenv/state/tls/rootCA.crt:/run/motet-tls/rootCA.crt:ro
    # Containers joining this network inherit PLC's hosts file. Docker does
    # not allow extra_hosts on a container joining another network namespace.
    extra_hosts:
      - 'motet.test:127.0.0.1'
      - 'pds.motet.test:127.0.0.1'
      - 'tenor.motet.test:127.0.0.1'
      - 'plc.motet.test:127.0.0.1'
      - 'relay.motet.test:127.0.0.1'
      - 'tap.motet.test:127.0.0.1'
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', '/bin/curl', '--fail', '--silent', 'http://localhost:2582/_health']
      interval: 2s
      retries: 30
    ports:
      - 127.0.0.1:443:443
      - 127.0.0.1:53535:53/tcp
      - 127.0.0.1:53535:53/udp

  dns:
    image: localhost/motet-dnsmasq:dev
    network_mode: service:plc
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    command:
      - --keep-in-foreground
      - --conf-file=
      - --user=
      - --group=
      - --pid-file=
      - --no-hosts
      - --log-facility=-
      - --address=/motet.test/127.0.0.1
      - --local=/motet.test/
    depends_on:
      plc: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/bin/busybox', 'nslookup', '-type=A', 'dns-ready.motet.test', '127.0.0.1']
      interval: 2s
      retries: 30

  caddy:
    image: localhost/motet-caddy:dev
    network_mode: service:plc
    user: '0:0'
    command: ['run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    environment:
      <<: *local-network-env
      MOTET_TLS_CERT: /run/motet-tls/server.crt
      MOTET_TLS_KEY: /run/motet-tls/server.key
      MOTET_CADDY_BIND: 0.0.0.0
      MOTET_WEB_UPSTREAM: host.docker.internal:4174
    configs: *local-resolver
    volumes:
      - ../nix/Caddyfile:/etc/caddy/Caddyfile:ro
      - *local-ca
      - ../.devenv/state/tls/rootCA.crt:/run/motet-tls/rootCA.crt:ro
      - ../.devenv/state/tls/server.crt:/run/motet-tls/server.crt:ro
      - ../.devenv/state/tls/server.key:/run/motet-tls/server.key:ro
    depends_on:
      plc: { condition: service_healthy }
      dns: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/bin/curl',
          '--fail',
          '--silent',
          '--cacert',
          '/run/motet-tls/rootCA.crt',
          'https://plc.motet.test/_health'
        ]
      interval: 2s
      retries: 30

  relay:
    image: localhost/motet-relay:dev
    network_mode: service:plc
    command: serve
    environment:
      <<: *local-network-env
      RELAY_ALLOW_PRIVATE_HOSTS: 'true'
      # Persistent dev volumes accumulate accounts; the default drops new commits as host-throttled.
      RELAY_DEFAULT_ACCOUNT_LIMIT: '1000000'
      RELAY_PLC_HOST: https://plc.motet.test
      RELAY_ADMIN_PASSWORD: motet-network-dev
      RELAY_API_BIND: 0.0.0.0:2470
      RELAY_METRICS_LISTEN: 0.0.0.0:2471
      DATABASE_URL: sqlite:///data/relay.sqlite
      RELAY_PERSIST_DIR: /data/persist
    configs: *local-resolver
    volumes:
      - *local-ca
      - relay:/data
    depends_on:
      plc: { condition: service_healthy }
      caddy: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/bin/curl', '--fail', '--silent', 'http://localhost:2470/_health']
      interval: 2s
      retries: 30

  tap:
    image: localhost/motet-tap:dev
    network_mode: service:plc
    command: run
    environment:
      <<: *local-network-env
      TAP_BIND: 0.0.0.0:2480
      TAP_DATABASE_URL: sqlite:///data/tap.sqlite
      TAP_RELAY_URL: https://relay.motet.test
      TAP_PLC_URL: https://plc.motet.test
      TAP_FULL_NETWORK: 'true'
      TAP_COLLECTION_FILTERS: at.motet.pilot.*,group.opensocial.*
      TAP_DISABLE_ACKS: 'false'
      TAP_ADMIN_PASSWORD: motet-network-dev
    configs: *local-resolver
    volumes:
      - *local-ca
      - tap:/data
    depends_on:
      relay: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          '/bin/curl',
          '--fail',
          '--silent',
          '--user',
          'admin:motet-network-dev',
          'http://localhost:2480/health'
        ]
      interval: 2s
      retries: 30

  pds-rs:
    image: localhost/motet-pds-rs:dev
    network_mode: service:plc
    environment:
      <<: *local-network-env
      PDS_BIND: 0.0.0.0
      PDS_PORT: '4800'
      PDS_HOSTNAME: pds.motet.test
      PDS_SERVICE_DID: did:web:pds.motet.test
      PDS_TRUSTED_PROXY_HOPS: '1'
      # The dev-only gate creates dozens of accounts and sessions from loopback within one window.
      PDS_RATE_LIMIT_AUTH: '0'
      PDS_DID_PLC_URL: https://plc.motet.test
      PDS_CRAWLERS: https://relay.motet.test
      PDS_INVITE_REQUIRED: 'false'
      PDS_ALLOW_DEV_DEFAULTS: 'true'
      PDS_SIGNUP_EMAIL_VERIFICATION: 'false'
      PDS_SERVICE_HANDLE_DOMAINS: .pds.motet.test
      PDS_DATA_DIRECTORY: /data
    configs: *local-resolver
    volumes:
      - *local-ca
      - pds-rs:/data
    depends_on:
      relay: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/bin/curl', '--fail', '--silent', 'http://localhost:4800/_ready']
      interval: 2s
      retries: 30
  relay-hosts:
    image: localhost/motet-relay:dev
    network_mode: service:plc
    environment:
      <<: *local-network-env
    configs: *local-resolver
    volumes:
      - *local-ca
    entrypoint: ['/bin/curl']
    command:
      - --fail-early
      - --fail-with-body
      - --silent
      - --show-error
      - --user
      - admin:motet-network-dev
      - --header
      - 'Content-Type: application/json'
      - --data
      - '{"hostname":"https://pds.motet.test"}'
      - https://relay.motet.test/admin/pds/requestCrawl
      # The default does not update persisted hosts; this reactivates throttled accounts too.
      - --next
      - --fail-with-body
      - --silent
      - --show-error
      - --user
      - admin:motet-network-dev
      - --header
      - 'Content-Type: application/json'
      - --data
      - '{"host":"https://pds.motet.test","repo_limit":1000000}'
      - https://relay.motet.test/admin/pds/changeLimits
      - --next
      - --fail-with-body
      - --silent
      - --show-error
      - --user
      - admin:motet-network-dev
      - --header
      - 'Content-Type: application/json'
      - --data
      - '{"hostname":"https://tenor.motet.test"}'
      - https://relay.motet.test/admin/pds/requestCrawl
      # The default does not update persisted hosts; this reactivates throttled accounts too.
      - --next
      - --fail-with-body
      - --silent
      - --show-error
      - --user
      - admin:motet-network-dev
      - --header
      - 'Content-Type: application/json'
      - --data
      - '{"host":"https://tenor.motet.test","repo_limit":1000000}'
      - https://relay.motet.test/admin/pds/changeLimits
    restart: on-failure
    depends_on:
      relay: { condition: service_healthy }
      pds-rs: { condition: service_healthy }
      tenor: { condition: service_started }

  appview-migrate:
    image: localhost/motet-appview:dev
    command: migrate
    environment:
      DATABASE_URL: postgres://motet:motet@postgres/motet
      MOTET_APPVIEW_S3_ENDPOINT: http://s3:8333
      MOTET_APPVIEW_S3_BUCKET: motet-archive
      MOTET_APPVIEW_S3_ACCESS_KEY: motet
      MOTET_APPVIEW_S3_SECRET_KEY: motet-dev-secret
    depends_on:
      postgres: { condition: service_healthy }

  appview:
    image: localhost/motet-appview:dev
    network_mode: service:plc
    command: serve
    environment:
      <<: *local-network-env
      DATABASE_URL: postgres://motet:motet@postgres/motet
      MOTET_APPVIEW_S3_ENDPOINT: http://s3:8333
      MOTET_APPVIEW_S3_BUCKET: motet-archive
      MOTET_APPVIEW_S3_ACCESS_KEY: motet
      MOTET_APPVIEW_S3_SECRET_KEY: motet-dev-secret
      MOTET_APPVIEW_LISTEN: 0.0.0.0:2583
      MOTET_APPVIEW_SERVICE_DID: did:web:motet.test#motet_appview
      MOTET_APPVIEW_PUBLIC_ORIGIN: https://motet.test
      MOTET_APPVIEW_DEFAULT_PDS: https://pds.motet.test
      MOTET_APPVIEW_TENOR_URL: https://tenor.motet.test
      MOTET_APPVIEW_TENOR_DID: did:web:tenor.motet.test
      MOTET_APPVIEW_OAUTH_SIGNING_KEY_FILE: /run/motet-oauth-key/oauth-signing-key
      MOTET_APPVIEW_SESSION_KEY_FILE: /run/motet-oauth-key/session-key
      MOTET_ALLOW_PRIVATE_NETWORK: 'true'
      MOTET_PLC_DIRECTORY: https://plc.motet.test
      MOTET_RELAY_URL: https://relay.motet.test
      MOTET_APPVIEW_TAP_URL: https://tap.motet.test
      MOTET_APPVIEW_TAP_ADMIN_PASSWORD: motet-network-dev
      MOTET_PDS_RS_URL: https://pds.motet.test
      RUST_LOG: info,motet=debug
    configs: *local-resolver
    volumes:
      - *local-ca
      - appview-oauth-key:/run/motet-oauth-key:ro
    depends_on:
      appview-migrate: { condition: service_completed_successfully }
      appview-oauth-key: { condition: service_completed_successfully }
      tap: { condition: service_healthy }
      buckets: { condition: service_completed_successfully }
      relay-hosts: { condition: service_completed_successfully }

  tenor:
    image: localhost/motet-tenor:dev
    network_mode: service:plc
    command: serve
    environment:
      <<: *local-network-env
      MOTET_TENOR_LISTEN: 0.0.0.0:2584
      MOTET_TENOR_PUBLIC_URL: https://tenor.motet.test
      MOTET_TENOR_HANDLE_DOMAINS: .motet.test
      MOTET_TENOR_CRAWLERS: https://relay.motet.test
      MOTET_TENOR_S3_ENDPOINT: http://s3:8333
      MOTET_TENOR_S3_BUCKET: motet-tenor
      MOTET_TENOR_S3_ACCESS_KEY: motet
      MOTET_TENOR_S3_SECRET_KEY: motet-dev-secret
      MOTET_TENOR_MASTER_KEY_FILE: /run/motet-key/master-key
      MOTET_ALLOW_PRIVATE_NETWORK: 'true'
      MOTET_PLC_DIRECTORY: https://plc.motet.test
      MOTET_RELAY_URL: https://relay.motet.test
      MOTET_TAP_URL: https://tap.motet.test
      MOTET_PDS_RS_URL: https://pds.motet.test
      RUST_LOG: info,motet=debug
    configs: *local-resolver
    volumes:
      - *local-ca
      - tenor-key:/run/motet-key:ro
    depends_on:
      buckets: { condition: service_completed_successfully }
      tenor-key: { condition: service_completed_successfully }
      relay: { condition: service_healthy }

configs:
  # Keep the engine's original resolver in the dns service; using `dns:`
  # would make Docker's embedded resolver forward back to dnsmasq.
  local-resolver:
    content: |
      nameserver 127.0.0.1

  s3-identities:
    content: |
      {"identities": [{"name": "motet",
        "credentials": [{"accessKey": "motet", "secretKey": "motet-dev-secret"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  postgres:
  s3:
  relay:
  tap:
  pds-rs:
  tenor-key:
  appview-oauth-key:
