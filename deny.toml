# cargo-deny: what may enter the dependency graph.
# Bans, licences and sources are checked in `nix flake check` and the `lint`
# script. Advisories need the network, so the `audit` script checks them
# weekly in CI (.github/workflows/scheduled.yaml): new ones appear without any
# change here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore is upstream's to fix, with the reason it doesn't bite Motet now.
# Revisit when the crate that pulls it in moves (Renovate groups them).
ignore = [
  # Typst's bibliography and syntax-highlighting stack (hayagriva, syntect,
  # two-face) and its text shaping. Nothing to upgrade to yet.
  { id = "RUSTSEC-2024-0436", reason = "paste, via typst-library: unmaintained, no known flaw" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml, via typst-library: unmaintained, no known flaw" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust, via syntect in typst-library: unmaintained, no known flaw" },
  { id = "RUSTSEC-2025-0141", reason = "bincode, via two-face in typst-library: unmaintained, no known flaw" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, Typst's shaper: unmaintained, no known flaw" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, Typst's font parser: unmaintained, no known flaw" },
  # quick-xml 0.38 in citationberg (hayagriva): a post can pass a CSL style as
  # bytes, but Typst runs in the render worker, whose CPU and memory limits
  # bound both denial-of-service flaws.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via typst-library; bounded by the render worker's limits" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via typst-library; bounded by the render worker's limits" },
  # hickory 0.25 in atproto-identity's handle resolution. Motet doesn't
  # enable DNSSEC validation (0118), and a lookup encodes one short name (0119); the fix
  # needs hickory 0.26 upstream.
  { id = "RUSTSEC-2026-0118", reason = "hickory-proto via atproto-identity; DNSSEC validation not enabled" },
  { id = "RUSTSEC-2026-0119", reason = "hickory-proto via atproto-identity; needs atproto-identity on hickory 0.26" },
]

[licenses]
version = 2
# Motet's own licence is still an open decision (docs/adr/0001); its crates are
# unpublished and skipped here. Dependencies must be permissive or weak
# copyleft so that choice stays open.
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Motet's own unpublished crates.
allow-wildcard-paths = true
# A second async runtime or TLS stack sneaking in is a review question, not a
# silent addition.
deny = [
  { crate = "openssl-sys", reason = "rustls only; one TLS stack" },
  { crate = "async-std", reason = "tokio only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# atproto-crates' Spaces, Tap and testkit crates are unreleased; the change
# that first uses them adds their repository here (docs/adr/0004):
#   "https://tangled.org/ngerakines.me/atproto-crates"
allow-git = []
