# The one toolchain declaration. The nix flake reads this file (rust-overlay's
# fromRustupToolchainFile) for the dev shell, the crane build and CI, so local
# and CI clippy can never disagree about lints.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer", "llvm-tools-preview"]
profile = "minimal"
