[package]
name = "motet-dice"
description = "Dice notation: parsing, bounds and evaluation against an injected random source. Pure."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Randomness is injected (`Source`): the tenor rolls with the OS's secure
# source and commits one result per request before returning it; tests roll
# with scripted sources. This crate never touches a clock or an RNG itself.
[dependencies]
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
