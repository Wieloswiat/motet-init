# The CI gate. The checking jobs run the shared Nix/devenv commands, so CI
# can't drift from what a developer runs locally:
#
#   checks   `nix flake check`: fmt, clippy, the default test suites, cargo-deny
#            (bans, licences, sources) and lexicon freshness, all hermetic and
#            cached per derivation.
#   gate     sets up local TLS and starts the development services, then runs
#            `devenv test` (the `ci` script): everything
#            above plus rustdoc's lints, the web packages, and the integration
#            and end-to-end suites.
#   proofs   `proofs`: the Spaces serving harnesses, with pinned Kani and CBMC.
#   images   on a push to main, once all three pass: builds the container
#            images with nix (no Dockerfile) and publishes them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main don't overlap: a new run waits until the running one ends,
  # so images are published in push order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # An explicit bash adds pipefail to the default -e, so a failure anywhere
    # in a pipeline fails the step.
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    # A cold Nix store builds the dependency artifacts (about 30 minutes)
    # before clippy and the tests (about 40). A cancelled run saves no cache,
    # so a limit below a cold build would keep every later run cold too.
    timeout-minutes: 120
    steps:
      # The runner's preinstalled SDKs leave about 14 GB free, and the Nix
      # store plus the archive cache-nix-action writes when saving it need
      # more. Nothing here uses them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'devenv.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Lock updates must be committed; the checks stay sandboxed builds.
      - run: nix flake check --no-update-lock-file --print-build-logs

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # As in `checks`: room for the Nix store and its cache archive.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: devenv-${{ runner.os }}-${{ hashFiles('flake.lock', 'devenv.lock', 'Cargo.lock', 'pnpm-lock.yaml') }}
          restore-prefixes-first-match: devenv-${{ runner.os }}-
      - name: Install native devenv
        # devenv 2.4.0, aligned with the module revision in devenv.lock.
        run: nix profile add github:cachix/devenv/9655d320b8f9df74dbecf681f52a7334574606c3
      - name: Set up local TLS
        run: devenv shell -- tls-setup
      # Watch the first run: readiness probes can hang devenv test (cachix/devenv#3215).
      - name: Service-backed gate
        run: devenv test 2>&1 | tee services.log
      - name: Service logs
        if: ${{ failure() }}
        run: |
          if [[ -f services.log ]]; then
            tail -n 100 services.log
            # Native devenv test prints its temporary per-run process log path.
            process_log="$(sed -nE 's/\x1b\[[0-9;]*[mK]//g; s/.*See logs: tail -f (.*\/processes[.]log).*/\1/p' services.log | tail -n 1)"
            if [[ -n "$process_log" && -f "$process_log" ]]; then
              cp -- "$process_log" processes.log
              tail -n 200 processes.log
            fi
          fi
      - name: Test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/nextest/ci/junit.xml
            target/nextest/integration/junit.xml
            apps/web/playwright-report/
            services.log
            processes.log
          if-no-files-found: ignore
          include-hidden-files: true

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Supplies the devenv.cachix.org substituter for native CLI binaries.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: proofs-${{ runner.os }}-${{ hashFiles('flake.lock', 'devenv.lock', 'Cargo.lock', 'nix/pkgs/kani.nix') }}
          restore-prefixes-first-match: proofs-${{ runner.os }}-
      - name: Install native devenv
        # devenv 2.4.0, aligned with the module revision in devenv.lock.
        run: nix profile add github:cachix/devenv/9655d320b8f9df74dbecf681f52a7334574606c3
      - name: Prove Spaces serving properties
        run: devenv shell -- proofs
      - name: Proof report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: proof-report
          path: target/kani/proofs.json
          if-no-files-found: error

  # Container images for deploy/compose.yaml and whatever runs Motet next,
  # tagged with the commit. `main` moves to a commit only while that commit
  # is the head of main.
  images:
    # A failed or cancelled check skips this job. Pull requests and the merge
    # queue run this workflow too, but only a push to main publishes.
    needs: [checks, gate, proofs]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job that can write packages.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [appview, tenor]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build
        env:
          FLAKE_OUTPUT: ${{ matrix.image }}-image
        run: |
          nix build --no-update-lock-file ".#$FLAKE_OUTPUT" -o result
          # skopeo from the nixpkgs that flake.lock pins, not from the newest
          # nixpkgs in the flake registry.
          nix build --inputs-from . nixpkgs#skopeo -o skopeo
      - name: Publish
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/motet-${{ matrix.image }}
          # skopeo pushes with it; gh reads the head of main with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Registry paths are lower case; owner names need not be.
          image="${IMAGE,,}"
          creds="$GITHUB_ACTOR:$GITHUB_TOKEN"
          ./result | ./skopeo/bin/skopeo copy --dest-creds "$creds" \
            docker-archive:/dev/stdin "docker://$image:$GITHUB_SHA"
          # A re-run of an older run must not move `main` back.
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::notice::main is now at $head, so $GITHUB_SHA keeps only its commit tag"
            exit 0
          fi
          # `main` gets the digest just pushed; nothing is uploaded twice. The
          # source is the same private package, so reading it needs credentials too.
          ./skopeo/bin/skopeo copy --src-creds "$creds" --dest-creds "$creds" \
            "docker://$image:$GITHUB_SHA" "docker://$image:main"
