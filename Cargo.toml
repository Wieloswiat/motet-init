[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/Wieloswiat/motet-init"

[workspace.dependencies]
# Motet crates. Paths only: nothing here is published.
motet-dice = { path = "crates/dice" }
motet-lexicons = { path = "crates/lexicons" }
motet-log = { path = "crates/log" }
motet-net = { path = "crates/net" }
motet-render = { path = "crates/render" }
motet-rules = { path = "crates/rules" }
motet-spaces = { path = "crates/spaces" }
motet-tenor = { path = "crates/tenor" }
motet-appview = { path = "crates/appview" }
motet-testkit = { path = "crates/testkit" }
motet-xrpc = { path = "crates/xrpc" }

# atproto-crates, all from one pinned revision of
# https://tangled.org/ngerakines.me/atproto-crates so no two copies of the
# core types meet (docs/adr/0004-atproto-crates.md). 0.15 isn't on crates.io:
# the Spaces, repo and Tap crates Motet needs exist only there. Bump the
# revision for all of them at once.
atproto-dasl = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-identity = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e", default-features = false }
atproto-lexicon = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e", default-features = false }
atproto-oauth = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e", default-features = false }
atproto-record = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-repo = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-space = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-space-client = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-tap = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-testkit = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }
atproto-xrpcs = { git = "https://tangled.org/ngerakines.me/atproto-crates", rev = "09a868cdde938c789326f1db16ffc30bbf38c15e" }

# Runtime and services.
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
getrandom = "0.4"
object_store = { version = "0.14", features = ["aws"] }
rand = "0.10"
# 0.13, the version atproto-crates uses, so their clients can be handed
# motet-net's hardened client instead of building their own.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
# One database per tenor shard, with its own WAL off: the shard's log is the
# only write-ahead log (docs/adr/0014-tenor-state-in-slatedb.md). Exact pin:
# SlateDB promises storage compatibility only between adjacent versions.
slatedb = { version = "=0.17.0", default-features = false, features = ["aws", "wal_disable"] }
# Sealing World keys under the tenor's master key.
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sqlx = { version = "0.9", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "derive",
  "macros",
  "migrate",
  "json",
  "chrono",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "timeout", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

# Typst. The worker's Typst follows typst.ts once the vector renderer lands
# (docs/adr/0008-rendering.md); until then plain typst for static SVG.
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
rlimit = "0.11"

# Testing.
proptest = "1"
proptest-state-machine = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

# The groups come first, at priority -1, so the lines below them can change
# single lints. The `restriction` group stays off: some of its lints
# contradict each other. We turn on its useful lints one by one, below.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Exceptions to the groups. Each one says why.
# The error type names each failure. An `# Errors` section on each function
# would only repeat it.
missing_errors_doc = "allow"
# A `const fn` promises that its body stays const. Make that promise on
# purpose (Google Rust style), not on each function that can be const.
missing_const_for_fn = "allow"
# This lint wants `pub` where rustc's `unreachable_pub` (above) wants
# `pub(crate)`. No code can satisfy both. We keep `unreachable_pub`.
redundant_pub_crate = "allow"
# cargo-deny owns duplicate dependency versions (`bans` in deny.toml). Most
# duplicates come from Typst and atproto-crates, and Motet cannot remove them.
multiple_crate_versions = "allow"

# Restriction lints, selected one by one.
# Panics. A panic stops a request or a shard task, so each panic must be
# explicit and say why. A bare unwrap hides why a value must exist;
# `expect("why")` says it. An index or a str slice out of range panics; use
# `.get()` and handle `None`. A str slice also panics inside a UTF-8 character.
unwrap_used = "warn"
indexing_slicing = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
# `exit()` runs no destructors, so open writers and guards do not finish.
# Return from `main` with an error or an `ExitCode` instead.
exit = "warn"
# Shared state and resources. `Arc::clone(&x)` shows that only a reference
# count changes. `Rc<Mutex<_>>` cannot cross threads, so its lock is useless.
# A forgotten guard or handle never releases its resource. An empty `Drop`
# does nothing.
clone_on_ref_ptr = "warn"
rc_mutex = "warn"
mem_forget = "warn"
empty_drop = "warn"
# A replay must give the same state each time. Hash order changes from run to
# run, so loops over hash maps and sets are not allowed.
iter_over_hash_type = "warn"
# Stdout carries the render worker's protocol and the services' JSON logs.
# Report through `tracing` or a returned error, not a print or `dbg!`.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Tests must run the code that ships.
cfg_not_test = "warn"
# Lint exceptions use `#[expect]`, which warns when its lint stops firing, so
# stale exceptions get removed. Each exception gives its reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
# Debug info for our crates only; dependencies compile faster without it.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package.proptest]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
