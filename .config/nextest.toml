# Test suites, from fastest to slowest:
#
#   default      pure and in-process tests, including property tests. No
#                services; every developer runs these on each change.
#   integration  `#[ignore = "integration: …"]` tests against real PostgreSQL,
#                S3 storage (SeaweedFS) and, later, a Spaces PDS (`devenv up`).
#                CI starts the same services from the same devenv
#                configuration and keeps this profile's JUnit file. No
#                retries: a test that fails once fails the run.
#   ci           default plus JUnit output and one retry. The retry shows
#                whether a failure is flaky or consistent; it never makes a
#                run pass. A test that passes only on its retry fails the run,
#                and junit.xml records it as flaky (ADR 0011).

[profile.default]
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
retries = { backoff = "fixed", count = 1, delay = "1s" }
flaky-result = "fail"
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"

[profile.integration]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.integration.junit]
path = "junit.xml"

# Integration tests share one database and one bucket; each test creates its own
# schema and key prefix, but heavy fault-injection tests still run one at a time.
[[profile.integration.overrides]]
filter = "test(/fault_/)"
test-group = "serial"

[test-groups]
serial = { max-threads = 1 }
