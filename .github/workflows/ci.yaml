# The CI gate. The checking jobs run commands defined in the nix flake, so CI
# can't drift from what a developer runs locally:
#
#   checks   `nix flake check`: fmt, clippy, the default test suites, cargo-deny
#            (bans, licences, sources) and lexicon freshness, all hermetic and
#            cached per derivation.
#   gate     sets up local TLS and starts the development services, then runs
#            the `ci` script (what `devenv test` runs locally): everything
#            above plus rustdoc's lints, the web packages, and the integration
#            and end-to-end suites.
#   images   on a push to main, once both pass: builds the container images
#            with nix (no Dockerfile) and publishes them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main don't overlap: a new run waits until the running one ends,
  # so images are published in push order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # An explicit bash adds pipefail to the default -e, so a failure anywhere
    # in a pipeline fails the step.
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The runner's preinstalled SDKs leave about 14 GB free, and the Nix
      # store plus the archive cache-nix-action writes when saving it need
      # more. Nothing here uses them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # devenv needs the working directory, so even the hermetic checks
      # evaluate impurely; the checks themselves stay sandboxed builds. An
      # input that flake.lock doesn't pin fails here, because nix would
      # otherwise lock it to its newest version, which no commit records.
      - run: nix flake check --no-pure-eval --no-update-lock-file --print-build-logs

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # As in `checks`: room for the Nix store and its cache archive.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: devenv-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'pnpm-lock.yaml') }}
          restore-prefixes-first-match: devenv-${{ runner.os }}-
      - name: Set up local TLS
        run: nix develop --no-pure-eval --command tls-setup
      - name: Start development services
        run: |
          # devenv-up is a script, not a package with a bin/ directory. It runs
          # inside the dev shell so processes see the same environment as
          # `devenv up` on a laptop; the background flag turns off the TUI.
          nix build --no-pure-eval .#devenv-up -o devenv-up
          DEVENV_PROCESS_MANAGER_BACKGROUND=1 \
            nohup nix develop --no-pure-eval --command ./devenv-up > services.log 2>&1 &
      - run: nix develop --no-pure-eval --command ci
      - name: Service logs
        if: ${{ failure() }}
        run: |
          if [[ -f services.log ]]; then tail -n 100 services.log; fi
          tail -n 200 .devenv/state/process-compose/process-compose.log || true
      - name: Test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/nextest/ci/junit.xml
            target/nextest/integration/junit.xml
            apps/web/playwright-report/
            services.log
            .devenv/state/process-compose/
          if-no-files-found: ignore
          include-hidden-files: true

  # Container images for deploy/compose.yaml and whatever runs Motet next,
  # tagged with the commit. `main` moves to a commit only while that commit
  # is the head of main.
  images:
    # A failed or cancelled check skips this job. Pull requests and the merge
    # queue run this workflow too, but only a push to main publishes.
    needs: [checks, gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job that can write packages.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [appview, tenor]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build
        env:
          FLAKE_OUTPUT: ${{ matrix.image }}-image
        run: |
          nix build --no-update-lock-file ".#$FLAKE_OUTPUT" -o result
          # skopeo from the nixpkgs that flake.lock pins, not from the newest
          # nixpkgs in the flake registry.
          nix build --inputs-from . nixpkgs#skopeo -o skopeo
      - name: Publish
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/motet-${{ matrix.image }}
          # skopeo pushes with it; gh reads the head of main with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Registry paths are lower case; owner names need not be.
          image="${IMAGE,,}"
          creds="$GITHUB_ACTOR:$GITHUB_TOKEN"
          ./result | ./skopeo/bin/skopeo copy --dest-creds "$creds" \
            docker-archive:/dev/stdin "docker://$image:$GITHUB_SHA"
          # A re-run of an older run must not move `main` back.
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "::notice::main is now at $head, so $GITHUB_SHA keeps only its commit tag"
            exit 0
          fi
          # `main` gets the digest just pushed; nothing is uploaded twice.
          ./skopeo/bin/skopeo copy --dest-creds "$creds" \
            "docker://$image:$GITHUB_SHA" "docker://$image:main"
