# cargo-deny: what may enter the dependency graph.
# Runs in `nix flake check` and on a nightly schedule (new advisories appear
# without any change here).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Motet's own licence is still an open decision (docs/adr/0001); its crates are
# unpublished and skipped here. Dependencies must be permissive or weak
# copyleft so that choice stays open.
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Motet's own unpublished crates.
allow-wildcard-paths = true
# A second async runtime or TLS stack sneaking in is a review question, not a
# silent addition.
deny = [
  { crate = "openssl-sys", reason = "rustls only; one TLS stack" },
  { crate = "async-std", reason = "tokio only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# atproto-crates' Spaces, Tap and testkit crates are unreleased; the change
# that first uses them adds their repository here (docs/adr/0004):
#   "https://tangled.org/ngerakines.me/atproto-crates"
allow-git = []
