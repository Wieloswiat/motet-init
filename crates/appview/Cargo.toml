[package]
name = "motet-appview"
description = "Motet's AppView: sign-in, the XRPC API, the indexer and its archive, projections, search and live updates."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "motet-appview"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
atproto-tap.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
motet-log.workspace = true
motet-net.workspace = true
motet-rules.workspace = true
motet-xrpc.workspace = true
object_store.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
motet-testkit = { workspace = true, features = ["services"] }
proptest.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
